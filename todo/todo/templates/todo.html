{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link rel="stylesheet" href="{% static 'css/index.css' %}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Font Awesome 5 Brands:wght@400&display=swap" />
    <script src="https://kit.fontawesome.com/cb792c0850.js" crossorigin="anonymous"></script>

</head>

<body>
    <div class="signup-login">
        <div>
            <div>
                <h1>Hello {{user}}</h1>
            </div>
            <div class=" signup-box scr">
                <div class="heads">
                    <!-- <div class="ancaa" title=""><i class="fa-solid fa-user"></i> </div> -->
                    <div class="heading">Get Things Done? </div>
                    <div class="anca"><a href="{% url 'signout' %}" class="sign"><i
                                class="fa-solid fa-right-from-bracket"></i></a></div>
                </div>


                <form method="post" action="/todopage/">
                    {% csrf_token %}
                    <label for="todo-title">New task</label>
                    <input id="todo-title" type="text" name="title" required maxlength="120" class="todo-input inp"
                        value="{{ request.POST.title }}" placeholder="What is the task today?"
                        aria-describedby="todo-error">
                    {% if error %}
                    <p id="todo-error" role="alert">{{ error }}</p>
                    {% endif %}


                    <input class="submit-button" type="submit" value="Add Task">

                </form>

                {% for todo in res %}
                <div class="Todo clickable-div {% if todo.completed %}todo-green{% else %}todo-red{% endif %}">
                    <p class="{% if todo.completed %}completed{% endif %}">{{ todo.title }}</p>
                    <div>
                        <a href="{% url 'edit_todo' todo.srno %}" aria-label="Edit {{ todo.title }}">
                            <i class="fa-solid fa-pen-to-square" aria-hidden="true"></i>
                        </a>
                        <form method="post" action="{% url 'delete_todo' todo.srno %}" style="display: inline;">
                            {% csrf_token %}
                            <button type="submit" aria-label="Delete {{ todo.title }}">
                                <i class="fa-solid fa-trash" aria-hidden="true"></i>
                            </button>
                        </form>
                    </div>
                </div>
                {% empty %}
                <p>You have no todos yet. Add your first task above.</p>
                {% endfor %}
            </div>


        </div>
    </div>
    <script src="{% static 'js/todo.js' %}"></script>
</body>

</html>
