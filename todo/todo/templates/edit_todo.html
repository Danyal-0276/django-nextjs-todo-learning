{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Todo</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link rel="stylesheet" href="{% static 'css/index.css' %}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Font Awesome 5 Brands:wght@400&display=swap" />
    <script src="https://kit.fontawesome.com/cb792c0850.js" crossorigin="anonymous"></script>

</head>

<body>
    
    <div class="signup-login">
        <div class=" signup-box scr">
            <div class="heading">Edit Task</div>
            <form method="post">
                {% csrf_token %}
                <label for="title">Task title</label>
                <input id="title" type="text" name="title" required maxlength="120" class="todo-input inp"
                    placeholder="What is the task today?" value="{{ obj.title }}" aria-describedby="title-error">
                {% if error %}
                <p id="title-error" role="alert">{{ error }}</p>
                {% endif %}
                
                <input class="submit-button" type="submit" value="Update Task">

            </form>
            <a href="/todopage/">Cancel and return to todos</a>
        </div>


    </div>
</body>

</html>
